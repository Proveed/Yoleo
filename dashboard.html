<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Leo - Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: #F0F4F8; padding: 20px; text-align: center; }
        .card { background: white; border-radius: 30px; padding: 25px; max-width: 500px; margin: 20px auto; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .btn-play { background: #FF6B6B; color: white; border: none; padding: 25px; border-radius: 40px; font-size: 1.8rem; width: 100%; max-width: 400px; cursor: pointer; box-shadow: 0 10px 0 #E55B5B; font-weight: bold; }
        .btn-play:active { transform: translateY(4px); box-shadow: 0 4px 0 #E55B5B; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="welcome">¡Hola! 👋</h2>
        <div id="avatar" style="font-size: 4rem; margin: 20px 0;">🦁</div>
        <button class="btn-play" onclick="activarYJugar()">🎯 JUGAR AHORA</button>
    </div>
<script>
    const supabaseClient = supabase.createClient('https://tnosgmtokfilkjpuxvtl.supabase.co', 'sb_publishable_Q8jlBysLLMf2RHoYAGiCNA_BRwDOEbR');
    async function init() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) window.location.href = "index.html";
        const { data } = await supabaseClient.from('children_profiles').select('*').eq('parent_id', session.user.id).single();
        if (data) {
            document.getElementById('welcome').innerText = `¡Hola, ${data.first_name}!`;
            document.getElementById('avatar').innerText = data.avatar_url;
        }
    }
    function activarYJugar() {
        const msj = new SpeechSynthesisUtterance("");
        window.speechSynthesis.speak(msj);
        window.location.href = 'leccion.html';
    }
    init();
</script>
</body>
</html>
