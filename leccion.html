<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Leo - ¡A jugar!</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: #FF6B6B; color: white; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        .pregunta { font-size: 2.5rem; margin-bottom: 40px; padding: 0 20px; }
        .opciones { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .tecla { background: white; color: #FF6B6B; width: 120px; height: 120px; border-radius: 30px; font-size: 4rem; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 0 #E2E8F0; transition: 0.1s; border: none; }
        .tecla:active { transform: translateY(8px); box-shadow: 0 2px 0 #E2E8F0; }
        .feedback { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; font-size: 5rem; z-index: 10; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="game">
    <div class="pregunta">¿Cuál es la letra <br><strong>A</strong>?</div>
    
    <div class="opciones">
        <button class="tecla" onclick="verificar('E')">E</button>
        <button class="tecla" onclick="verificar('A')">A</button>
        <button class="tecla" onclick="verificar('O')">O</button>
    </div>
</div>

<div id="feedback" class="feedback"></div>

<script>
    function verificar(letra) {
        const f = document.getElementById('feedback');
        f.style.display = 'flex';
        
        if(letra === 'A') {
            f.innerHTML = "🌟 ¡SÍ! 🌟";
            f.style.color = "#4ECDC4";
            setTimeout(() => window.location.href = 'dashboard.html', 2000);
            // Aquí sumaremos 10 segundos a la bóveda en Supabase
        } else {
            f.innerHTML = "❌ ¡Casi! ❌";
            f.style.color = "#FF6B6B";
            setTimeout(() => f.style.display = 'none', 1000);
        }
    }
</script>

</body>
</html>
