<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Leo - Juego</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: #FF6B6B; color: white; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .letra-objetivo { font-size: 8rem; color: #FFD93D; margin: 20px 0; }
        .opciones { display: flex; justify-content: center; gap: 20px; }
        .tecla { background: white; color: #FF6B6B; width: 110px; height: 110px; border-radius: 30px; font-size: 4rem; border: none; cursor: pointer; box-shadow: 0 10px 0 #E55B5B; font-weight: bold; }
        #animacion { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; font-size: 5rem; background: rgba(78, 205, 196, 0.95); z-index: 10; }
    </style>
</head>
<body>
    <div id="game">
        <div style="font-size: 2rem;">Toca la letra:</div>
        <div class="letra-objetivo" id="letraTxt">A</div>
        <div class="opciones" id="btns"></div>
    </div>
    <div id="animacion">🌟 ¡BIEN! 🌟</div>
<script>
    const supabaseClient = supabase.createClient('https://tnosgmtokfilkjpuxvtl.supabase.co', 'sb_publishable_Q8jlBysLLMf2RHoYAGiCNA_BRwDOEbR');
    const niveles = [
        { obj: 'A', ops: ['E', 'A', 'O'] },
        { obj: 'E', ops: ['E', 'I', 'U'] },
        { obj: 'I', ops: ['A', 'I', 'O'] },
        { obj: 'O', ops: ['O', 'U', 'E'] },
        { obj: 'U', ops: ['A', 'E', 'U'] }
    ];
    let actual = 0;
    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-MX'; m.rate = 0.8; window.speechSynthesis.speak(m);
    }
    function cargar() {
        const n = niveles[actual];
        document.getElementById('letraTxt').innerText = n.obj;
        const b = document.getElementById('btns');
        b.innerHTML = '';
        n.ops.forEach(l => {
            const btn = document.createElement('button');
            btn.className = 'tecla'; btn.innerText = l;
            btn.onclick = () => validar(l); b.appendChild(btn);
        });
        hablar("Toca la letra " + n.obj);
    }
    async function validar(l) {
        if(l === niveles[actual].obj) {
            document.getElementById('animacion').style.display = 'flex';
            hablar("¡Excelente! Esa es la " + l);
            setTimeout(() => {
                document.getElementById('animacion').style.display = 'none';
                actual++;
                if(actual < niveles.length) cargar(); 
                else { hablar("¡Terminaste! Muy bien."); setTimeout(()=> window.location.href='dashboard.html', 2000); }
            }, 1500);
        } else { hablar("No, esa es la " + l + ". Busca la " + niveles[actual].obj); }
    }
    window.onload = cargar;
</script>
</body>
</html>
