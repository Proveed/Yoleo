<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Leo - Registro SOW</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: linear-gradient(to bottom, #FFFFFF, #FFEFBA); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 450px; border-radius: 40px; padding: 30px; text-align: center; border: 4px solid #FFD93D; box-shadow: 0 15px 0 #FFD93D; }
        h1 { color: #FF6B6B; font-size: 1.5rem; margin-bottom: 10px; }
        input { width: 90%; padding: 12px; border: 3px solid #4ECDC4; border-radius: 15px; font-size: 1rem; text-align: center; margin-bottom: 10px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; }
        .icon { font-size: 2rem; padding: 8px; border: 3px solid #f0f0f0; border-radius: 15px; cursor: pointer; transition: 0.2s; background: #f9f9f9; }
        .selected { border-color: #FF6B6B; background: #FFF3F3; transform: scale(1.1); }
        button { background: #4ECDC4; color: white; border: none; padding: 18px; border-radius: 30px; font-size: 1.4rem; width: 100%; cursor: pointer; box-shadow: 0 8px 0 #3FB0A8; font-weight: bold; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="step1">
        <h1>Cuenta del Padre</h1>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña segura">
        <button onclick="siguiente()">SIGUIENTE ➔</button>
    </div>

    <div id="step2" class="hidden">
        <h1>Perfil del Niño</h1>
        <input type="text" id="nombreNino" placeholder="Nombre del niño">
        <div class="grid">
            <div class="icon" onclick="sel(this, '🦁')">🦁</div>
            <div class="icon" onclick="sel(this, '🚀')">🚀</div>
            <div class="icon" onclick="sel(this, '🦖')">🦖</div>
            <div class="icon" onclick="sel(this, '🦄')">🦄</div>
            <div class="icon" onclick="sel(this, '🎨')">🎨</div>
            <div class="icon" onclick="sel(this, '🐼')">🐼</div>
        </div>
        <button onclick="finalizarRegistro()">¡LISTO PARA LEER! ➔</button>
    </div>
</div>

<script>
    const supabaseClient = supabase.createClient('https://tnosgmtokfilkjpuxvtl.supabase.co', 'sb_publishable_Q8jlBysLLMf2RHoYAGiCNA_BRwDOEbR');
    let icono = '';

    function sel(el, icon) {
        document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        icono = icon;
    }

    function siguiente() {
        if(!document.getElementById('email').value || !document.getElementById('password').value) return alert("Completa los datos");
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    }

    async function finalizarRegistro() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const nombre = document.getElementById('nombreNino').value;

        if(!nombre || !icono) return alert("Elige nombre e icono");

        // 1. Crear Usuario en Supabase Auth
        const { data: authData, error: authError } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
        });

        if(authError) return alert("Error Auth: " + authError.message);

        const userId = authData.user.id;

        // 2. Registrar Dispositivo (Control de 5)
        await supabaseClient.from('user_devices').insert([{ user_id: userId, device_info: navigator.userAgent, is_master: true }]);

        // 3. Crear Perfil del Niño usando la función RPC que ya está en tu SQL
        const { error: rpcError } = await supabaseClient.rpc('create_complete_child_profile', {
            p_first_name: nombre,
            p_age: 3,
            p_favorite_franchise: 'paw_patrol',
            p_avatar_url: icono,
            p_parent_id: userId
        });

        if(rpcError) {
            console.error(rpcError);
            alert("Error al crear perfil del niño");
        } else {
            alert("¡Registro exitoso, Luis Alejandro!");
            window.location.href = "dashboard.html";
        }
    }
</script>

</body>
</html>
