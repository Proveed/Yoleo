<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOW - Registro</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; font-family: 'Fredoka One', cursive; background: #FFD93D; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 400px; border-radius: 50px; padding: 40px; text-align: center; border: 8px solid #FF6B6B; box-shadow: 0 20px 0 #E55B5B; }
        h1 { color: #4ECDC4; font-size: 2rem; margin-bottom: 20px; }
        input { width: 85%; padding: 15px; border: 4px solid #4ECDC4; border-radius: 25px; font-size: 1.2rem; text-align: center; margin-bottom: 15px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .icon { font-size: 3rem; padding: 10px; border: 4px solid #f0f0f0; border-radius: 25px; cursor: pointer; background: #f9f9f9; }
        .selected { border-color: #FF6B6B; background: #FFEAEA; transform: scale(1.1); }
        button { background: #FF6B6B; color: white; border: none; padding: 20px; border-radius: 40px; font-size: 1.5rem; width: 100%; cursor: pointer; box-shadow: 0 10px 0 #E55B5B; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="card">
    <div id="step1">
        <h1>¡Hola Papá!</h1>
        <input type="email" id="email" placeholder="Tu Correo">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="siguiente()">SIGUIENTE ➔</button>
    </div>
    <div id="step2" class="hidden">
        <h1>¿Quién eres?</h1>
        <input type="text" id="nombreNino" placeholder="Nombre">
        <div class="grid">
            <div class="icon" onclick="sel(this, '🦁')">🦁</div>
            <div class="icon" onclick="sel(this, '🚀')">🚀</div>
            <div class="icon" onclick="sel(this, '🦖')">🦖</div>
            <div class="icon" onclick="sel(this, '🦄')">🦄</div>
            <div class="icon" onclick="sel(this, '🎨')">🎨</div>
            <div class="icon" onclick="sel(this, '🐼')">🐼</div>
        </div>
        <button onclick="finalizarRegistro()">¡A JUGAR! ➔</button>
    </div>
</div>
<script>
    const supabaseClient = supabase.createClient('https://tnosgmtokfilkjpuxvtl.supabase.co', 'sb_publishable_Q8jlBysLLMf2RHoYAGiCNA_BRwDOEbR');
    let icono = '';

    // Verifica si ya hay sesión al entrar
    supabaseClient.auth.getSession().then(({data}) => {
        if (data.session) window.location.href = "dashboard.html";
    });

    function sel(el, icon) {
        document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected'); icono = icon;
    }
    function siguiente() {
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
    }
    async function finalizarRegistro() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const nombre = document.getElementById('nombreNino').value;
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) return alert(error.message);
        await supabaseClient.rpc('create_complete_child_profile', {
            p_parent_id: data.user.id, p_first_name: nombre, p_age: 3, p_favorite_franchise: 'general', p_avatar_url: icono
        });
        window.location.href = "dashboard.html";
    }
</script>
</body>
</html>
