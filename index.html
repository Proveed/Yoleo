<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yo Leo - Registro SOW</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* CSS INTEGRADO - Diseño Responsivo y Colorido */
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: linear-gradient(to bottom, #FFFFFF, #FFEFBA); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; width: 100%; max-width: 450px; border-radius: 40px; padding: 30px; text-align: center; border: 4px solid #FFD93D; box-shadow: 0 15px 0 #FFD93D; }
        h1 { color: #FF6B6B; font-size: 1.8rem; }
        input { width: 85%; padding: 15px; border: 3px solid #4ECDC4; border-radius: 20px; font-size: 1.1rem; text-align: center; margin-bottom: 20px; outline: none; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin: 20px 0; }
        .icon { font-size: 2.5rem; padding: 10px; border: 3px solid #f0f0f0; border-radius: 20px; cursor: pointer; transition: 0.2s; background: #f9f9f9; }
        .selected { border-color: #FF6B6B; background: #FFF3F3; transform: scale(1.1); }
        button { background: #4ECDC4; color: white; border: none; padding: 18px; border-radius: 30px; font-size: 1.4rem; width: 100%; cursor: pointer; box-shadow: 0 8px 0 #3FB0A8; font-weight: bold; }
        button:active { transform: translateY(4px); box-shadow: 0 4px 0 #3FB0A8; }
    </style>
</head>
<body>

<div class="card">
    <h1>¿Cómo te llamas?</h1>
    <input type="text" id="nombre" placeholder="Escribe tu nombre">
    
    <h1>Elige tu compañero</h1>
    <div class="grid">
        <div class="icon" onclick="sel(this, '🦁')">🦁</div>
        <div class="icon" onclick="sel(this, '🚀')">🚀</div>
        <div class="icon" onclick="sel(this, '🦖')">🦖</div>
        <div class="icon" onclick="sel(this, '🦄')">🦄</div>
        <div class="icon" onclick="sel(this, '🎨')">🎨</div>
        <div class="icon" onclick="sel(this, '🐼')">🐼</div>
    </div>

    <button onclick="registrar()">¡EMPEZAR AVENTURA! ➔</button>
</div>

<script>
    // JAVASCRIPT INTEGRADO - Lógica y Conexión Supabase
    const SUPABASE_URL = 'https://tnosgmtokfilkjpuxvtl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Q8jlBysLLMf2RHoYAGiCNA_BRwDOEbR';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { persistSession: true } // Sesión permanente activa
    });

    let iconoSeleccionado = '';

    function sel(el, icon) {
        document.querySelectorAll('.icon').forEach(i => i.classList.remove('selected'));
        el.classList.add('selected');
        iconoSeleccionado = icon;
    }

    async function registrar() {
        const nombre = document.getElementById('nombre').value;
        if(!nombre || !iconoSeleccionado) return alert("Por favor, pon tu nombre y elige un icono.");

        // Para esta fase, usaremos un ID temporal. 
        // En la siguiente lección activaremos el Login real del padre.
        alert("SOW: Registrando a " + nombre + " con el icono " + iconoSeleccionado);
        
        // Simulación de guardado exitoso
        window.location.href = "dashboard.html";
    }
</script>

</body>
</html>
